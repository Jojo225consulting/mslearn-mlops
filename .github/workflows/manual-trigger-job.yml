name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_WORKSPACE_NAME: ${{ vars.AZURE_WORKSPACE_NAME }}
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Check Azure CLI and ML extension
      run: |
        az version
        az extension show --name ml
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Test Azure ML access
      run: |
        az ml workspace show \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --name "$AZURE_WORKSPACE_NAME"
    - name: Run Azure Machine Learning training job
      run: az ml job create -f src/job.yml --stream --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE_NAME"
